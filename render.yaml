services:
  - type: web
    name: realtime-karaoke-room
    env: node
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start -w @karaoke/frontend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        value: ""
      - key: NEXT_PUBLIC_SOCKET_URL
        value: ""
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
